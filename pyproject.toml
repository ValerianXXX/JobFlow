[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobflow-local"
version = "0.1.0"
description = "Local-first, evidence-gated job application workflow"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "JobFlow Contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Pillow>=10,<12",
  "pdfplumber>=0.11,<1",
  "pypdf>=4,<6",
  "python-docx>=1.1,<2",
]

[project.scripts]
jobflow = "jobops.cli:main"
jobops = "jobops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobops = ["ui/*.html", "ui/*.js", "ui/*.css"]
