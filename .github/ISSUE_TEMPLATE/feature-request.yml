name: Feature request
description: Propose a bounded improvement with explicit privacy and action impact.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Describe the user problem without attaching real applicant or recruiting-site data.
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI impact
      options: ["No AI change", "Changes AI analysis", "Adds an AI adapter", "Unsure"]
    validations:
      required: true
  - type: dropdown
    id: private_data
    attributes:
      label: Private-data impact
      options: ["None", "Secure-ref only", "New private field", "Unsure"]
    validations:
      required: true
  - type: dropdown
    id: external_action
    attributes:
      label: External-action impact
      options: ["None", "Offline synthetic only", "Would require future authorization", "Unsure"]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results and tests.
    validations:
      required: true
