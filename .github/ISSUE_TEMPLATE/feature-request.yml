name: Feature request / 功能建议
description: Propose a bounded improvement with explicit privacy and action impact. / 提出边界明确、说明隐私与动作影响的改进。
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem without attaching real applicant or recruiting-site data.
        请说明用户问题，但不要附上真实求职者或招聘网站资料。
  - type: textarea
    id: problem
    attributes:
      label: User problem / 用户问题
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 期望结果
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI impact / AI 影响
      options: ["No AI change / 不改变 AI", "Changes AI analysis / 改变 AI 分析", "Adds an AI adapter / 新增 AI 适配器", "Unsure / 不确定"]
    validations:
      required: true
  - type: dropdown
    id: private_data
    attributes:
      label: Private-data impact / 私人数据影响
      options: ["None / 无", "Secure-ref only / 仅 secure-ref", "New private field / 新私人字段", "Unsure / 不确定"]
    validations:
      required: true
  - type: dropdown
    id: external_action
    attributes:
      label: External-action impact / 外部动作影响
      options: ["None / 无", "Offline synthetic only / 仅离线合成", "Would require future authorization / 未来需另行授权", "Unsure / 不确定"]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / 验收标准
      description: List observable results and tests. / 列出可观察结果与测试。
    validations:
      required: true
