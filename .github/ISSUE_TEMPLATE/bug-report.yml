name: Bug report
description: Report a reproducible JobFlow defect using synthetic data only.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste a real resume, profile, answer, Claim evidence, API key, token, cookie, absolute user path, database, DPAPI file, or screenshot containing personal data.
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options: ["Chinese", "English", "Both"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Install or startup", "Onboarding UI", "AI analysis", "Claim review", "Browser Companion", "Queue", "Offline ATS", "Release tooling", "Other"]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Give the smallest steps and synthetic fixture needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JobFlow version or commit
      placeholder: v0.3.0 or a short commit hash
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I used only synthetic or redacted values and included no private applicant data.
          required: true
        - label: I disclosed every browser, network, upload, or other external action involved in the reproduction.
          required: true
