name: JobFlow verification

on:
  push:
  pull_request:

concurrency:
  group: jobflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install JobFlow
        run: python -m pip install -e ".[build]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run redacted one-click health check
        shell: pwsh
        run: ./scripts/check-jobflow.ps1 -Json -PythonPath (Get-Command python).Source
      - name: Exercise first-time Windows installer
        if: matrix.python-version == '3.12'
        shell: powershell
        run: |
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          # Keep the isolated root short enough for stock Windows runners without LongPathsEnabled.
          $acceptanceId = [Guid]::NewGuid().ToString("N").Substring(0, 8)
          $acceptanceRoot = [IO.Path]::GetFullPath((Join-Path $runnerTemp ("jobflow-fixed-install-qa-" + $acceptanceId)))
          $runnerPrefix = $runnerTemp.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          if (
            -not $acceptanceRoot.StartsWith($runnerPrefix, [StringComparison]::OrdinalIgnoreCase) -or
            ([IO.Path]::GetFileName($acceptanceRoot)) -notlike "jobflow-fixed-install-qa-*"
          ) {
            throw "JOBFLOW_CI_ACCEPTANCE_ROOT_FORBIDDEN"
          }
          $savedLocalAppData = $env:LOCALAPPDATA
          $savedAppData = $env:APPDATA
          $savedTemp = $env:TEMP
          $savedTmp = $env:TMP
          $savedAcceptance = $env:JOBFLOW_INSTALL_ACCEPTANCE_CORE_ONLY
          try {
            $isolatedLocalAppData = Join-Path $acceptanceRoot "LocalAppData"
            $isolatedAppData = Join-Path $acceptanceRoot "RoamingAppData"
            New-Item -ItemType Directory -Path $isolatedLocalAppData, $isolatedAppData -Force | Out-Null
            $env:LOCALAPPDATA = $isolatedLocalAppData
            $env:APPDATA = $isolatedAppData
            $env:TEMP = $runnerTemp
            $env:TMP = $runnerTemp
            $env:JOBFLOW_INSTALL_ACCEPTANCE_CORE_ONLY = "1"
            ./scripts/install-jobflow.ps1 -NoLaunch
            if ($LASTEXITCODE -ne 0) {
              throw "The first-time Windows installer failed."
            }
            $installedRoot = Join-Path $isolatedLocalAppData "JobOps"
            $pointer = Get-Content -LiteralPath (Join-Path $installedRoot "current.json") -Raw | ConvertFrom-Json
            $healthScript = Join-Path $installedRoot "bin\check-installed-jobflow.ps1"
            $healthOutput = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $healthScript -Json
            $healthExitCode = $LASTEXITCODE
            $health = $healthOutput | ConvertFrom-Json
            if (
              $healthExitCode -ne 0 -or
              $health.status -ne "JOBFLOW_READY" -or
              $health.version -ne $pointer.version
            ) {
              throw "The first-time Windows installer did not produce a healthy installed JobFlow runtime."
            }
          }
          finally {
            $env:LOCALAPPDATA = $savedLocalAppData
            $env:APPDATA = $savedAppData
            $env:TEMP = $savedTemp
            $env:TMP = $savedTmp
            if ($null -eq $savedAcceptance) {
              Remove-Item Env:JOBFLOW_INSTALL_ACCEPTANCE_CORE_ONLY -ErrorAction SilentlyContinue
            }
            else {
              $env:JOBFLOW_INSTALL_ACCEPTANCE_CORE_ONLY = $savedAcceptance
            }
            if (
              (Test-Path -LiteralPath $acceptanceRoot -PathType Container) -and
              $acceptanceRoot.StartsWith($runnerPrefix, [StringComparison]::OrdinalIgnoreCase) -and
              ([IO.Path]::GetFileName($acceptanceRoot)) -like "jobflow-fixed-install-qa-*"
            ) {
              [IO.Directory]::Delete("\\?\" + $acceptanceRoot, $true)
            }
          }
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Build Browser Companion store package
        if: matrix.python-version == '3.12'
        run: python scripts/build_browser_companion_store_package.py
      - name: Check public tree boundary
        run: python -m jobops.public_release
      - name: Build wheel without publishing
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Check CLI entry point
        run: jobflow --help
      - name: Build and smoke complete source candidate without upload
        if: matrix.python-version == '3.12'
        run: python -m jobops.release_candidate
