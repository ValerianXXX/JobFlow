name: JobFlow verification

on:
  push:
  pull_request:

concurrency:
  group: jobflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install JobFlow
        run: python -m pip install -e ".[build]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run redacted one-click health check
        shell: pwsh
        run: ./scripts/check-jobflow.ps1 -Json -PythonPath (Get-Command python).Source
      - name: Exercise first-time Windows installer
        if: matrix.python-version == '3.12'
        shell: powershell
        run: |
          ./scripts/install-jobflow.ps1
          $health = ./scripts/check-jobflow.ps1 -Json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $health.status -ne "JOBFLOW_READY") {
            throw "The first-time Windows installer did not produce a healthy JobFlow runtime."
          }
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Build Browser Companion store package
        if: matrix.python-version == '3.12'
        run: python scripts/build_browser_companion_store_package.py
      - name: Check public tree boundary
        run: python -m jobops.public_release
      - name: Build wheel without publishing
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Check CLI entry point
        run: jobflow --help
      - name: Build and smoke complete source candidate without upload
        if: matrix.python-version == '3.12'
        run: python -m jobops.release_candidate
