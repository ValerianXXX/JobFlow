name: JobFlow verification

on:
  push:
  pull_request:

concurrency:
  group: jobflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows-tests:
    runs-on: windows-latest
    # The full Windows regression suite intentionally exercises DPAPI,
    # installer rollback, and browser E2E paths. Leave enough headroom for a
    # cold hosted runner without weakening the checks.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Provision the pinned signed legacy test interpreter
        id: legacy-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Test-only prerequisite for the existing PSF signer policy and
          # legacy installer discovery, not the shipped 3.13 runtime.
          python-version: "3.11.3"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Provision the pinned signed Git test prerequisite
        shell: powershell
        run: |
          # windows-latest changes its preinstalled Git independently of our
          # pinned release toolchain. Use verified upstream ZIP bytes in the
          # existing canonical tool location; do not relax production trust.
          # https://github.com/git-for-windows/git/releases/tag/v2.53.0.windows.3
          $gitRoot = Join-Path ([Environment]::GetFolderPath("UserProfile")) ".cache\codex-runtimes\codex-primary-runtime\dependencies\native\git"
          if (Test-Path -LiteralPath $gitRoot) { throw "JOBFLOW_CI_GIT_DESTINATION_EXISTS" }
          $gitArchive = Join-Path $env:RUNNER_TEMP "jobflow-ci-MinGit-2.53.0.3-64-bit.zip"
          if (Test-Path -LiteralPath $gitArchive) { throw "JOBFLOW_CI_GIT_ARCHIVE_EXISTS" }
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/git-for-windows/git/releases/download/v2.53.0.windows.3/MinGit-2.53.0.3-64-bit.zip" -OutFile $gitArchive
          if ((Get-FileHash -LiteralPath $gitArchive -Algorithm SHA256).Hash -cne "0D7C85A26E45668B35D0D0AEB763289376CFC039E55E0938A617ED0DFA32E433") {
            throw "JOBFLOW_CI_GIT_ARCHIVE_HASH_MISMATCH"
          }
          Expand-Archive -LiteralPath $gitArchive -DestinationPath $gitRoot
          $gitPath = Join-Path $gitRoot "mingw64\bin\git.exe"
          if ((Get-FileHash -LiteralPath $gitPath -Algorithm SHA256).Hash -cne "C115A66A1BEDE6694B513AF420CC90F8775BE03666A54D1ECB82D6196B929FE9") {
            throw "JOBFLOW_CI_GIT_EXECUTABLE_HASH_MISMATCH"
          }
          $signature = Microsoft.PowerShell.Security\Get-AuthenticodeSignature -LiteralPath $gitPath
          $policy = Get-Content -LiteralPath config/release-toolchain.json -Raw | ConvertFrom-Json
          $trusted = @($policy.tools.git.allowed_signers | Where-Object {
            $_.subject -ceq $signature.SignerCertificate.Subject -and
            $_.thumbprint -ceq $signature.SignerCertificate.Thumbprint
          })
          if ($signature.Status -ne "Valid" -or $trusted.Count -ne 1) {
            throw "JOBFLOW_CI_GIT_UNTRUSTED"
          }
          "JOBFLOW_RELEASE_GIT_PATH=$gitPath" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare canonical Windows test paths and signed project launcher
        shell: powershell
        env:
          LEGACY_TEST_PYTHON: ${{ steps.legacy-python.outputs.python-path }}
        run: |
          $canonicalTemp = & python -I -c "from pathlib import Path; import tempfile; print(Path(tempfile.gettempdir()).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { throw "JOBFLOW_CI_TEMP_RESOLUTION_FAILED" }
          "TEMP=$canonicalTemp" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$canonicalTemp" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          $signature = Microsoft.PowerShell.Security\Get-AuthenticodeSignature -LiteralPath $env:LEGACY_TEST_PYTHON
          $policy = Get-Content -LiteralPath config/release-toolchain.json -Raw | ConvertFrom-Json
          $trusted = @($policy.tools.python.allowed_signers | Where-Object {
            $_.subject -ceq $signature.SignerCertificate.Subject -and
            $_.thumbprint -ceq $signature.SignerCertificate.Thumbprint
          })
          if ($signature.Status -ne "Valid" -or $trusted.Count -ne 1) {
            throw "JOBFLOW_CI_LEGACY_PYTHON_UNTRUSTED"
          }
          # Exercise unmodified canonical installer discovery. Never resolve
          # production prerequisites from PATH or replace its signature checks.
          $canonicalParent = Join-Path ([Environment]::GetFolderPath("LocalApplicationData")) "Programs\Python"
          $canonicalPython = Join-Path $canonicalParent "Python311.3"
          if (Test-Path -LiteralPath $canonicalPython) { throw "JOBFLOW_CI_LEGACY_DESTINATION_EXISTS" }
          New-Item -ItemType Directory -Path $canonicalParent -Force | Out-Null
          Copy-Item -LiteralPath (Split-Path -Parent $env:LEGACY_TEST_PYTHON) -Destination $canonicalPython -Recurse
          & $env:LEGACY_TEST_PYTHON -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "JOBFLOW_CI_SIGNED_VENV_FAILED" }
          & ./.venv/Scripts/python.exe -m pip install -e ".[build]"
          if ($LASTEXITCODE -ne 0) { throw "JOBFLOW_CI_SIGNED_VENV_DEPENDENCIES_FAILED" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned Browser Companion test runtime
        run: npm ci
      - name: Install JobFlow
        run: python -m pip install -e ".[build]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run redacted one-click health check
        shell: pwsh
        run: ./scripts/check-jobflow.ps1 -Json -PythonPath (Get-Command python).Source
      - name: Run regression suite
        # Full discovery includes every installer test once per interpreter.
        run: python -m unittest discover -s tests -v
      - name: Install pinned Playwright Chromium
        run: npx playwright install chromium
      - name: Run Browser Companion and onboarding UI E2E suites
        run: npm run test:e2e
      - name: Build Browser Companion store package
        if: matrix.python-version == '3.12'
        run: python scripts/build_browser_companion_store_package.py
      - name: Check public tree boundary
        run: python -m jobops.public_release --git-path $env:JOBFLOW_RELEASE_GIT_PATH
      - name: Build wheel without publishing
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Check CLI entry point
        run: jobflow --help
      - name: Build and smoke complete source candidate without upload
        if: matrix.python-version == '3.12'
        shell: powershell
        run: python -m jobops.release_candidate --git-path $env:JOBFLOW_RELEASE_GIT_PATH
