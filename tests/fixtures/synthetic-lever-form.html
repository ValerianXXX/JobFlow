<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Synthetic Lever form</title></head><body>
<main><h1>Synthetic application</h1><form action="/example/abc-123/apply">
<label for="name">Full name</label><input id="name" name="full_name" type="text" autocomplete="name" required>
<label for="portfolio">Portfolio URL</label><input id="portfolio" name="portfolio" type="url">
<label for="linkedin">LinkedIn profile</label><input id="linkedin" name="linkedin" type="url">
<label for="resume">Resume</label><input id="resume" name="resume" type="file">
<button type="submit">Submit application</button>
</form></main></body></html>
