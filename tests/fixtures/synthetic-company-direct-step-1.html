<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Company step 1</title></head><body>
<main data-provider="company"><h1>My Information</h1><form action="/careers/entry-data-analyst/apply/questions">
<h2>Contact Information</h2>
<label for="full-name">Full name</label><input id="full-name" name="full_name" type="text" required>

<button type="button">Continue</button>
</form></main></body></html>
