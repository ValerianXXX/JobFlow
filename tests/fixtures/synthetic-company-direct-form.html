<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Synthetic company application</title></head><body>
<form action="/careers/entry-data-analyst/apply">
  <h2>Applicant details</h2>
  <label for="full-name">Full name</label><input id="full-name" name="full_name" type="text" autocomplete="name" required>
  <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required>
  <label for="resume">Resume</label><input id="resume" name="resume" type="file" required>
  <button type="button">Continue</button>
  <button type="submit">Submit application</button>
</form></body></html>
